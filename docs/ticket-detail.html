<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Winning Team – Ticket Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ticket-detail-shell">

    <!-- HEADER -->
    <header class="ticket-header">
      <div class="ticket-title-block">
        <h1 class="ticket-title">The Winning Team — Ticket Detail</h1>
        <nav class="top-nav">
          <a href="index.html" class="nav-pill">Home</a>
          <a href="Showcase.html" class="nav-pill">Showcase</a>
          <a href="tickets.html" class="nav-pill nav-pill--active">Ticket App</a>
        </nav>
      </div>

      <div class="ticket-header-actions">
        <button id="toggleNightShift" type="button">Night Shift Mode 🦉</button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="ticket-main ticket-main--detail">
      <!-- Overview card (populated by JS) -->
      <section class="section">
        <h2>Ticket Overview</h2>
        <p class="small-note">
          This page loads a single ticket and its message history from the live AWS backend.
        </p>

        <div id="ticketMeta" class="ticket-meta-card">
          <!-- ticket fields rendered here -->
        </div>
      </section>

      <!-- Messages -->
      <section class="section section--messages">
        <h3>Messages</h3>

        <div id="messagesList" class="messages-list">
          <!-- message bubbles rendered here -->
        </div>

        <form class="message-composer" onsubmit="return false;">
          <label for="messageInput" class="sr-only">Add a message</label>
          <textarea
            id="messageInput"
            rows="3"
            placeholder="Type your message here…"
          ></textarea>
          <button
            id="sendMessageBtn"
            type="button"
            class="primary-cta primary-cta--wide"
          >
            Send Message
          </button>
        </form>

        <div id="detailStatus" class="status-message status-message--inline"></div>
      </section>
    </main>

    <footer class="site-footer site-footer--compact">
      <p>Built by The Winning Team — Powered by AWS (API Gateway, Lambda, DynamoDB).</p>
    </footer>
  </div>

  <!-- Global theme + interactions -->
  <script src="script.js"></script>
  <!-- Your existing ticket detail logic (the JS we wrote earlier) -->
  <script src="ticket-detail.js"></script>
</body>
</html>
