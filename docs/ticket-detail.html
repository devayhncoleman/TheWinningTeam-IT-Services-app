<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Winning Team – Ticket Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <div class="page-accent"></div>

    <div class="page-main">
      <!-- HEADER -->
      <header class="site-header">
        <div class="header-inner">
          <h1 class="site-title">The Winning Team — Ticket Detail</h1>
          <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="Showcase.html">Showcase</a>
            <a href="tickets.html">Ticket App</a>
          </nav>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="page-content">
        <section class="section">
          <h2>Ticket Overview</h2>
          <p class="mini">
            This page loads a single ticket and its message history from the live AWS backend.
          </p>

          <div id="ticketMeta" class="ticket-meta"></div>
        </section>

        <section class="section">
          <h3>Messages</h3>
          <div id="messagesList" class="messages-list">
            <!-- filled by ticket-detail.js -->
          </div>

          <div class="message-composer">
            <label for="messageInput" class="mini">Add a message</label>
            <textarea id="messageInput" placeholder="Type your message here..."></textarea>
            <button id="sendMessageBtn" type="button">Send Message</button>
            <div id="detailStatus" class="status-message"></div>
          </div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="site-footer">
        <p>Built by The Winning Team — Powered by AWS (API Gateway, Lambda, DynamoDB).</p>
      </footer>
    </div>
  </div>

  <script src="ticket-detail.js"></script>
</body>
</html>
