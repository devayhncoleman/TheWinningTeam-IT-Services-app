<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Winning Team — Ticket Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body class="theme-classic">
  <div class="ticket-detail-shell">

    <header class="ticket-header">
      <div class="ticket-title-block">
        <h1 class="ticket-title">Ticket Detail</h1>

        <nav class="top-nav">
          <a href="index.html" class="nav-pill">Home</a>
          <a href="Showcase.html" class="nav-pill">Showcase</a>
          <a href="tickets.html" class="nav-pill nav-pill--active">Ticket App</a>
        </nav>

        <p class="mini">Loads 1 ticket + message history • Posts new messages</p>
      </div>

      <div class="ticket-header-actions">
        <button id="toggleNightShift" type="button">Lime Mode</button>
      </div>
    </header>

    <main class="ticket-main">

      <section class="section">
        <h2>Ticket Overview</h2>
        <div id="ticketMeta" class="ticket-meta-card"></div>
        <div id="detailStatus" class="status-message"></div>
      </section>

      <section class="section">
        <h3>Messages</h3>
        <div id="messagesList" class="messages-list"></div>

        <form class="message-composer" onsubmit="return false;">
          <label for="messageInput" class="sr-only">Add a message</label>
          <textarea id="messageInput" rows="4" placeholder="Type your message…"></textarea>
          <button id="sendMessageBtn" class="primary-cta" type="button">Send Message</button>
        </form>
      </section>

    </main>

    <footer class="site-footer">
      <p>Built by The Winning Team — Powered by AWS (API Gateway, Lambda, DynamoDB).</p>
    </footer>
  </div>

  <script src="script.js?v=9"></script>
  <script src="ticket-detail.js?v=9"></script>
</body>
</html>
