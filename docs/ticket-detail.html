<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Winning Team — Ticket Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="shell">

    <div class="card topbar">
      <div class="brand">
        <h1>Ticket Detail</h1>
        <p class="sub">Single ticket + message history</p>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="Showcase.html">Showcase</a>
        <a class="active" href="tickets.html">Live App</a>
      </nav>
    </div>

    <div class="card card-pad section">
      <h2>Ticket Overview</h2>
      <p>Ticket fields + assignment info, then chat messages below.</p>

      <div id="ticketMeta" class="meta panel">
        <!-- ticket-detail.js renders here -->
      </div>

      <div class="hr"></div>

      <h3>Messages</h3>

      <div id="messagesList" class="messages">
        <!-- ticket-detail.js renders here -->
      </div>

      <div class="composer">
        <div class="composer-head">
          <div>
            <div class="k">Add a message</div>
            <div class="k" style="margin-top:4px;">Max 1200 chars • HTML-safe</div>
          </div>
          <a class="btn btn-ghost" href="tickets.html">Back</a>
        </div>

        <textarea id="messageInput" placeholder="Type your message..." maxlength="1200"></textarea>

        <div class="composer-actions">
          <button id="sendMessageBtn" class="btn btn-solid" type="button">Send Message</button>
          <div id="detailStatus" class="status"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>Powered by AWS • TicketMessages supports ordered chat</div>
    </div>

  </div>

  <script src="script.js?v=2"></script>
  <script src="ticket-detail.js?v=2"></script>
</body>
</html>
